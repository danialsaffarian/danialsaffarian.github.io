name: Build product pages for search engines

on:
  schedule:
    # هر ۳ ساعت صفحه‌ی محصولات و کالکشن‌ها و sitemap از روی محصولات فعلی ساخته می‌شه
    - cron: '17 */3 * * *'
  workflow_dispatch: # اجرای دستی از تب Actions، مثلاً بعد از اضافه کردن محصول جدید
  push:
    branches: [main]
    paths: ['tools/seo/**', 'index.html']

permissions:
  contents: write

concurrency:
  group: seo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/seo/build.mjs
      - name: Commit if anything changed
        run: |
          git add -A p c 404.html sitemap.xml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "hana-gallery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update product pages and sitemap"
          git push
