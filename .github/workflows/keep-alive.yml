name: Keep Supabase Alive

on:
  schedule:
    # هر ۳ روز یک‌بار ساعت ۳ بامداد (به‌وقت جهانی) اجرا می‌شه — کاملاً کافیه چون سقف بی‌فعالیتی سوپابیس ۷ روزه
    - cron: '0 3 */3 * *'
  workflow_dispatch: # امکان اجرای دستی از تب Actions هم فراهمه، برای تست

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep project active
        run: |
          curl -s -o /dev/null -w "Supabase responded with status: %{http_code}\n" \
            "https://goykyskctygnciwttfqj.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: sb_publishable_ZUgUSquwnM1YNMsL6OKgQQ_lS5EmsuG" \
            -H "Authorization: Bearer sb_publishable_ZUgUSquwnM1YNMsL6OKgQQ_lS5EmsuG"
